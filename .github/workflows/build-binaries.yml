name: Build and Test Multi-Architecture Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: ~

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'rabbit-going-nats'
  TEST_PROJECT_PATH: 'rabbit-going-nats-tests'

jobs:
  test-and-coverage:
    name: Run Tests and Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build application
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-restore

      - name: Run unit and integration tests with coverage
        run: |
          cd ${{ env.TEST_PROJECT_PATH }}
          dotnet test --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/ \
            --logger trx \
            --logger "console;verbosity=detailed"

      - name: Generate coverage report
        run: |
          cd ${{ env.TEST_PROJECT_PATH }}
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./TestResults/*/coverage.cobertura.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"Html;Cobertura;JsonSummary" \
            -verbosity:Info

      - name: Check coverage threshold
        run: |
          cd ${{ env.TEST_PROJECT_PATH }}
          COVERAGE=$(grep -o '"linecoverage":[0-9.]*' ./CoverageReport/Summary.json | cut -d':' -f2)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 65" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below required 65%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets requirement (≥65%)"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.TEST_PROJECT_PATH }}/CoverageReport/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.TEST_PROJECT_PATH }}/TestResults/
          retention-days: 30

  integration-test:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build application for testing
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release

      - name: Run simple-feature-test
        run: |
          cd simple-feature-test
          make all
        timeout-minutes: 3

  build-linux-amd64:
    name: Build Linux AMD64
    runs-on: ubuntu-latest
    needs: [test-and-coverage, integration-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish Linux AMD64
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./artifacts/linux-amd64/ \
            -p:PublishAot=true \
            -p:StripSymbols=true

      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-going-nats-linux-amd64
          path: ./artifacts/linux-amd64/
          compression-level: 9
          retention-days: 90

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    needs: [test-and-coverage, integration-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish Linux ARM64
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained true \
            --output ./artifacts/linux-arm64/ \
            -p:PublishAot=true \
            -p:StripSymbols=true

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-going-nats-linux-arm64
          path: ./artifacts/linux-arm64/
          compression-level: 9
          retention-days: 90

  create-release-summary:
    name: Create Release Summary
    runs-on: ubuntu-latest
    needs: [test-and-coverage, integration-test, build-linux-amd64, build-linux-arm64]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "# 🚀 Build and Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit and Integration Tests: ${{ needs.test-and-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ End-to-End Integration: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 Coverage Requirement: ≥65%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux AMD64: ${{ needs.build-linux-amd64.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux ARM64: ${{ needs.build-linux-arm64.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`rabbit-going-nats-linux-amd64\` - Native AOT binary for x64" >> $GITHUB_STEP_SUMMARY
          echo "- \`rabbit-going-nats-linux-arm64\` - Native AOT binary for ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- \`coverage-report\` - HTML and detailed coverage analysis" >> $GITHUB_STEP_SUMMARY
          echo "- \`test-results\` - Detailed test execution results" >> $GITHUB_STEP_SUMMARY